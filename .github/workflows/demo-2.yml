name: Demo-2

on:
  workflow_dispatch:

jobs:
  build:
     runs-on: ubuntu-latest

     steps:
      - name: Create a text file
        run: echo "Hello, world!" > hello.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hello-file
          path: hello.txt

  test:
     needs: build
     runs-on: ubuntu-latest
     steps:
      - uses: actions/download-artifact@v5
        with:
          name: hello-file
          path: .
      - name: List file
        run: ls -R

      - name: Test file
        run: cat hello.txt | grep -i "Hello, world!"  
  
